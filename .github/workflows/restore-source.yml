name: Restore ProofTrail application source

on:
  push:
    branches: [main]
    paths:
      - "prooftrail-source.READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prooftrail-source-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and validate source archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          test -f prooftrail-source.READY
          compgen -G 'prooftrail-source.part-*' >/dev/null
          cat prooftrail-source.part-* | base64 --decode > /tmp/prooftrail-source.tar.gz
          gzip -t /tmp/prooftrail-source.tar.gz
          tar -tzf /tmp/prooftrail-source.tar.gz > /tmp/prooftrail-files.txt
          if grep -E '(^/|(^|/)\.\.( /|$)|^\.\./)' /tmp/prooftrail-files.txt; then
            echo "Archive has a suspicious path" >&2
            exit 1
          fi
          tar --no-same-owner --no-same-permissions -xzf /tmp/prooftrail-source.tar.gz -C .
          test -f package.json
          test -f src/app/page.tsx
          test -f db/migrations/0001_initial_schema.sql
          echo "Extracted $(wc -l < /tmp/prooftrail-files.txt) source paths"
      - name: Run source checks (record any failures for follow-up)
        id: checks
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "npm install failed; see logs below."
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run typecheck
          type_status=$?
          npm run lint
          lint_status=$?
          npm test
          test_status=$?
          npm run build
          build_status=$?
          if [ "$type_status" -eq 0 ] && [ "$lint_status" -eq 0 ] && [ "$test_status" -eq 0 ] && [ "$build_status" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "One or more checks failed. The source will still be committed so the failures can be corrected in follow-up commits."
          fi
      - name: Commit restored source and remove transfer files
        if: steps.extract.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f prooftrail-source.part-* prooftrail-source.READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
            exit 0
          fi
          git commit -m "build: add ProofTrail application source"
          git push origin main
      - name: Report validation status
        if: always()
        run: |
          echo "Source restoration job finished."
          echo "Validation result: ${{ steps.checks.outputs.result || 'not reached' }}"
          echo "A passing validation run is required before treating this branch as releasable."
