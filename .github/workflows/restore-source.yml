name: Expand source bundle

on:
  push:
    branches: [main]
    paths:
      - 'prooftrail-source.part-05'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check for source bundle
        id: guard
        shell: bash
        run: |
          if [ -f prooftrail-source.part-00 ]; then echo 'present=true' >> "$GITHUB_OUTPUT"; else echo 'present=false' >> "$GITHUB_OUTPUT"; fi
      - name: Reassemble and expand source files
        if: steps.guard.outputs.present == 'true'
        run: |
          cat prooftrail-source.part-* | base64 -d > prooftrail-source.tar.gz
          tar -xzf prooftrail-source.tar.gz -C .
          rm -f prooftrail-source.tar.gz prooftrail-source.part-*
      - name: Set up Python
        if: steps.guard.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Test backend
        if: steps.guard.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. pytest -q
      - name: Set up Node
        if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        if: steps.guard.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit expanded source tree
        if: steps.guard.outputs.present == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: expand ProofTrail application source tree'
          git push
