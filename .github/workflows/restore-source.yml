name: Restore ProofTrail source

on:
  push:
    branches: [main]
    paths:
      - 'prooftrail-source.READY'

permissions:
  contents: write

concurrency:
  group: prooftrail-source-restore
  cancel-in-progress: false

jobs:
  restore-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate and expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s prooftrail-source.READY
          compgen -G 'prooftrail-source.part-*' >/dev/null
          cat prooftrail-source.part-* | base64 --decode > /tmp/prooftrail-source.tar.gz
          tar -tzf /tmp/prooftrail-source.tar.gz >/dev/null
          tar -xzf /tmp/prooftrail-source.tar.gz -C .
          test -f backend/app/main.py
          test -f frontend/package.json
      - name: Install backend and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          PYTHONPATH=. pytest -q
          rm -f /tmp/prooftrail-migration-check.db
          PROOFTRAIL_DATABASE_URL=sqlite:////tmp/prooftrail-migration-check.db \
          PROOFTRAIL_DATA_DIR=/tmp/prooftrail-migration-data \
          PROOFTRAIL_SESSION_SECRET=ci-session-secret-not-for-production-0000000000 \
            alembic upgrade head
      - name: Install frontend dependencies, typecheck and build
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Replace bootstrap bundle with the normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f prooftrail-source.part-* prooftrail-source.READY
          rm -f .github/workflows/restore-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m 'build: add tested ProofTrail full-stack application'
          git push origin main
