services:
  backend:
    build: { context: ./backend }
    restart: unless-stopped
    environment:
      PROOFTRAIL_ENVIRONMENT: ${PROOFTRAIL_ENVIRONMENT:-development}
      PROOFTRAIL_DATABASE_URL: ${PROOFTRAIL_DATABASE_URL:-sqlite:////app/data/prooftrail.db}
      PROOFTRAIL_DATA_DIR: /app/data
      PROOFTRAIL_SESSION_SECRET: ${PROOFTRAIL_SESSION_SECRET:-local-development-secret-change-before-deploying-32characters}
      PROOFTRAIL_SESSION_COOKIE_NAME: prooftrail_session
      PROOFTRAIL_SESSION_TTL_HOURS: ${PROOFTRAIL_SESSION_TTL_HOURS:-168}
      PROOFTRAIL_COOKIE_SECURE: ${PROOFTRAIL_COOKIE_SECURE:-false}
      PROOFTRAIL_DEMO_MODE: ${PROOFTRAIL_DEMO_MODE:-true}
      PROOFTRAIL_ALLOW_SIGNUP: ${PROOFTRAIL_ALLOW_SIGNUP:-false}
      PROOFTRAIL_MAX_UPLOAD_MB: ${PROOFTRAIL_MAX_UPLOAD_MB:-10}
      PROOFTRAIL_CORS_ORIGINS: ${PROOFTRAIL_CORS_ORIGINS:-http://localhost:8080}
      PROOFTRAIL_OPENAI_COMPATIBLE_BASE_URL: ${PROOFTRAIL_OPENAI_COMPATIBLE_BASE_URL:-}
      PROOFTRAIL_OPENAI_COMPATIBLE_API_KEY: ${PROOFTRAIL_OPENAI_COMPATIBLE_API_KEY:-}
      PROOFTRAIL_LLM_MODEL: ${PROOFTRAIL_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - prooftrail_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks: [app]
  frontend:
    build: { context: ./frontend }
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${PROOFTRAIL_PORT:-8080}:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [app]
networks:
  app: { driver: bridge }
volumes:
  prooftrail_data:
